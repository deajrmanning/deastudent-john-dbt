version: 2

models:
  - name: EMPLOYEE
    description: "DBT model for employee table"
    columns:
      - name: emp_id
        tests:
          - unique
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4]
              config:
                severity: warn
      - name: emp_salary
        tests:
          - value_check
  - name: customer
    description: DBT model for customer table
  - name: customer_view
    description: DBT model to create a filtered view of customer table.
  - name: sales
    description: DBT model for sales table  
  - name: product
    description: DBT model for product table
  - name: purchase
    description: DBT model for purchase table using update/insert.
  - name: clean_orders
    description: DBT model to create clean orders temp table in snowflake.
  - name: final_orders
    description: DBT model to create the final orders table in your warehouse, from your clean_orders temp table.              


sources:
  - name: employee
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: EMPLOYEE_RAW
  - name: customer
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: CUSTOMER_SRC
  - name: sales
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: SALES_SRC
  - name: product
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: PRODUCT_SRC  
  - name: purchase
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: PURCHASE_SRC
  - name: clean_orders
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: BASE_ORDERS